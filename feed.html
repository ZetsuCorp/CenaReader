<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CenaReader — Creator Network</title>
<style>
  :root{
    --bg:#0a0a10; --panel:#131320; --panel-2:#191928; --text:#ece9f2; --text-dim:#9997ab; --line:#262438;
    --spectrum: conic-gradient(from 180deg, #e8478c, #e8b93e, #46d6d6, #7a6ff0, #e8478c);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; line-height:1.5; }
  .wrap{ max-width:640px; margin:0 auto; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  .logo{
    font-family:Georgia,serif; font-weight:700; font-size:20px;
    background:var(--spectrum); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .author-search{
    flex:1; max-width:280px; margin:0 16px;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:20px; padding:8px 14px; font-size:15px;
  }
  .author-search::placeholder{ color:var(--text-dim); }
  .upload-btn{
    background:linear-gradient(135deg,#e8478c,#7a6ff0); color:#fff; border:none;
    border-radius:20px; padding:8px 18px; font-size:15px; font-weight:700; cursor:pointer;
  }

  .upload-form{
    position:fixed; inset:0; z-index:100;
    background:rgba(5,5,10,0.72);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .upload-form-inner{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px 24px 22px; max-width:420px; width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    max-height:88vh; overflow-y:auto;
  }
  .form-label{
    display:block; font-size:13px; text-transform:uppercase; letter-spacing:1px;
    color:var(--text-dim); font-weight:700; margin:14px 0 6px;
  }
  .upload-form-inner input[type="text"]{
    width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:9px 10px; font-size:15.5px;
  }
  .upload-form-inner input[type="file"]{
    width:100%; font-size:14.5px; color:var(--text-dim);
  }
  .cancel-btn{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
    border-radius:20px; padding:8px 18px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .form-status{ font-size:14.5px; color:var(--text-dim); margin-top:10px; }
  .ad-card{
    border-style:dashed;
    padding:24px 16px;
    text-align:center;
  }
  .ad-card-label{
    font-size:12.5px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--text-dim); font-weight:700; margin-bottom:8px;
  }
  .ad-card-body{ color:var(--text-dim); font-size:15px; }

  .feed-section{ padding:8px 20px 40px; }
  .feed-label{
    font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-dim);
    font-weight:700; margin:14px 4px 14px;
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; margin-bottom:22px;
  }
  .card-cover{
    width:100%; aspect-ratio:1/1; display:block; object-fit:cover;
  }
  .card-body{ padding:16px; }
  .card-title{ font-family:Georgia,serif; font-size:19px; margin-bottom:2px; }
  .card-creator{ font-size:14.5px; color:var(--text-dim); margin-bottom:12px; }
  .play-row{
    display:flex; align-items:center; gap:10px; background:var(--panel-2);
    border-radius:20px; padding:8px 8px 8px 10px; margin-bottom:12px;
  }
  .play-btn{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#e8478c,#7a6ff0); color:#fff; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .progress-track{ flex:1; height:4px; background:var(--line); border-radius:2px; position:relative; }
  .progress-fill{ position:absolute; left:0; top:0; height:100%; border-radius:2px; background:var(--spectrum); }
  .duration{ font-size:13px; color:var(--text-dim); flex-shrink:0; }
  .stats-row{ display:flex; gap:18px; font-size:14.5px; color:var(--text-dim); }
  .stats-row span{ display:flex; align-items:center; gap:5px; }

  footer{
    border-top:1px solid var(--line); padding:28px 20px; text-align:center;
    color:var(--text-dim); font-size:14px;
  }
  .empty-state{ text-align:center; color:var(--text-dim); font-size:14px; padding:40px 20px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="logo" href="https://cenareader.ploy.build/" style="text-decoration:none;">CenaReader</a>
    <input type="text" class="author-search" id="authorSearch" placeholder="Find an author...">
    <button class="upload-btn" onclick="document.getElementById('uploadForm').style.display='flex';">+ Upload</button>
  </header>

  <div class="upload-form" id="uploadForm" style="display:none;" onclick="if(event.target===this){this.style.display='none';}">
    <div class="upload-form-inner">
      <div class="feed-label" style="margin-top:0;">New Upload</div>
      <label class="form-label">Cover image</label>
      <input type="file" id="coverInput" accept="image/*">
      <label class="form-label">Audio file</label>
      <input type="file" id="audioInput" accept="audio/*">
      <label class="form-label">Title</label>
      <input type="text" id="titleInput" placeholder="Chro Ma Key: Colors Beyond Reality">
      <label class="form-label">Creator name</label>
      <input type="text" id="creatorInput" placeholder="Artworqq">
      <label class="form-label">Chapter / episode label (optional)</label>
      <input type="text" id="chapterInput" placeholder="Act 1">
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="upload-btn" id="uploadSubmitBtn">Post to feed</button>
        <button class="cancel-btn" onclick="document.getElementById('uploadForm').style.display='none';">Cancel</button>
      </div>
      <div class="form-status" id="uploadFormStatus"></div>
    </div>
  </div>

  <div class="feed-section">
    <div class="feed-label">Recently Created</div>
    <div id="feedList">
      <div class="empty-state" id="feedEmptyState">Loading...</div>
    </div>
  </div>

  <footer>
    CenaReader Creator Network · ZETSU EOe
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Wire the modal FIRST — this must work even if Supabase fails to load.
  const uploadSubmitBtn = document.getElementById('uploadSubmitBtn');
  const uploadFormStatus = document.getElementById('uploadFormStatus');
  const feedList = document.getElementById('feedList');
  const authorSearch = document.getElementById('authorSearch');

  let supabase = null;
  let allPosts = [];

  try{
    if(!window.supabase) throw new Error('Supabase library did not load from the CDN.');
    const SUPABASE_URL = "https://jtrdxlqtxjffzqtansqj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Q2tAo9bOgcvVW6KUBDQBAA_WTMpLloP";
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }catch(err){
    console.error('Supabase init failed:', err);
    feedList.innerHTML = '<div class="empty-state">Could not connect to the database — check your connection and refresh.</div>';
  }

  function formatDuration(totalSeconds){
    const mins = Math.floor(totalSeconds / 60);
    const secs = String(Math.round(totalSeconds % 60)).padStart(2, '0');
    return `${mins}:${secs}`;
  }

  function buildCard(post){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.postId = post.id;
    card.dataset.creatorName = post.creator_name.toLowerCase();
    card.innerHTML = `
      <img class="card-cover" src="${post.cover_url}" alt="cover">
      <div class="card-body">
        <div class="card-title">${post.title}</div>
        <div class="card-creator">by ${post.creator_name}${post.chapter_label ? ' · ' + post.chapter_label : ''}</div>
        <div class="play-row">
          <button class="play-btn">▶</button>
          <div class="progress-track"><div class="progress-fill" style="width:0%;"></div></div>
          <div class="duration">${formatDuration(post.duration_sec)}</div>
          <audio src="${post.audio_url}" style="display:none;"></audio>
        </div>
        <div class="stats-row">
          <span>♥ <span class="like-count">${post.like_count}</span></span>
          <span>▶ <span class="play-count">${post.play_count}</span> plays</span>
        </div>
      </div>
    `;

    const audioEl = card.querySelector('audio');
    const playBtn = card.querySelector('.play-btn');
    const progressFill = card.querySelector('.progress-fill');
    const playCountEl = card.querySelector('.play-count');
    let counted = false;

    playBtn.addEventListener('click', () => {
      if(audioEl.paused){ audioEl.play(); playBtn.textContent = '❚❚'; }
      else { audioEl.pause(); playBtn.textContent = '▶'; }
    });
    audioEl.addEventListener('timeupdate', () => {
      if(audioEl.duration){
        progressFill.style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
      }
      if(!counted && audioEl.currentTime > 3){
        counted = true;
        playCountEl.textContent = parseInt(playCountEl.textContent) + 1;
        supabase.rpc('increment_play_count', { post_id: post.id }).then(({ error }) => {
          if(error) console.error('play count increment failed', error);
        });
      }
    });
    audioEl.addEventListener('ended', () => { playBtn.textContent = '▶'; });

    return card;
  }

  function renderAdCard(){
    const ad = document.createElement('div');
    ad.className = 'card ad-card';
    ad.innerHTML = `<div class="ad-card-label">Sponsored</div><div class="ad-card-body">Ad space</div>`;
    return ad;
  }

  function renderFeed(posts){
    feedList.innerHTML = '';
    if(!posts.length){
      feedList.innerHTML = '<div class="empty-state">Nothing here yet — be the first to upload.</div>';
      return;
    }
    posts.forEach((post, i) => {
      feedList.appendChild(buildCard(post));
      if((i + 1) % 3 === 0 && i !== posts.length - 1){
        feedList.appendChild(renderAdCard());
      }
    });
  }

  async function loadFeed(){
    if(!supabase) return;
    const { data, error } = await supabase
      .from('audio_book_posts')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      feedList.innerHTML = '<div class="empty-state">Could not load the feed.<br><br>Error: ' + (error.message || JSON.stringify(error)) + '</div>';
      console.error(error);
      return;
    }
    allPosts = data;
    renderFeed(allPosts);
  }

  authorSearch.addEventListener('input', () => {
    const q = authorSearch.value.trim().toLowerCase();
    if(!q){ renderFeed(allPosts); return; }
    renderFeed(allPosts.filter(p => p.creator_name.toLowerCase().includes(q)));
  });

  uploadSubmitBtn.addEventListener('click', async () => {
    if(!supabase){ uploadFormStatus.textContent = 'Not connected to the database — refresh and try again.'; return; }
    const coverFile = document.getElementById('coverInput').files[0];
    const audioFile = document.getElementById('audioInput').files[0];
    const title = document.getElementById('titleInput').value.trim();
    const creator = document.getElementById('creatorInput').value.trim();
    const chapter = document.getElementById('chapterInput').value.trim();

    if(!coverFile){ uploadFormStatus.textContent = 'A cover image is required.'; return; }
    if(!audioFile){ uploadFormStatus.textContent = 'An audio file is required.'; return; }
    if(!title){ uploadFormStatus.textContent = 'A title is required.'; return; }
    if(!creator){ uploadFormStatus.textContent = 'A creator name is required.'; return; }

    uploadSubmitBtn.disabled = true;
    uploadFormStatus.textContent = 'Reading audio duration...';

    const probe = new Audio(URL.createObjectURL(audioFile));
    probe.addEventListener('loadedmetadata', async () => {
      const durationSec = Math.round(probe.duration);

      try{
        uploadFormStatus.textContent = 'Uploading cover...';
        const coverExt = coverFile.name.split('.').pop();
        const coverPath = `${Date.now()}-${Math.random().toString(36).slice(2)}.${coverExt}`;
        const { error: coverErr } = await supabase.storage.from('covers').upload(coverPath, coverFile);
        if(coverErr) throw coverErr;
        const coverUrl = supabase.storage.from('covers').getPublicUrl(coverPath).data.publicUrl;

        uploadFormStatus.textContent = 'Uploading audio...';
        const audioExt = audioFile.name.split('.').pop();
        const audioPath = `${Date.now()}-${Math.random().toString(36).slice(2)}.${audioExt}`;
        const { error: audioErr } = await supabase.storage.from('audio').upload(audioPath, audioFile);
        if(audioErr) throw audioErr;
        const audioUrl = supabase.storage.from('audio').getPublicUrl(audioPath).data.publicUrl;

        uploadFormStatus.textContent = 'Posting...';
        const { error: insertErr } = await supabase.from('audio_book_posts').insert({
          creator_name: creator,
          title: title,
          chapter_label: chapter || null,
          cover_url: coverUrl,
          audio_url: audioUrl,
          duration_sec: durationSec
        });
        if(insertErr) throw insertErr;

        uploadFormStatus.textContent = 'Posted.';
        document.getElementById('coverInput').value = '';
        document.getElementById('audioInput').value = '';
        document.getElementById('titleInput').value = '';
        document.getElementById('creatorInput').value = '';
        document.getElementById('chapterInput').value = '';
        await loadFeed();
        setTimeout(() => { document.getElementById('uploadForm').style.display = 'none'; uploadFormStatus.textContent = ''; }, 800);
      }catch(err){
        console.error(err);
        uploadFormStatus.textContent = 'Error: ' + (err.message || 'upload failed') + '.';
      }finally{
        uploadSubmitBtn.disabled = false;
      }
    });

    probe.addEventListener('error', () => {
      uploadFormStatus.textContent = 'Could not read that audio file — try a different format (MP3 works best).';
      uploadSubmitBtn.disabled = false;
    });
  });

  if(supabase) loadFeed();
</script>
</body>
</html>
